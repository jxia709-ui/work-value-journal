name: Apply verified production fixes

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-runtime-fixes.mjs
      - scripts/run-runtime-fixes.mjs
      - .github/workflows/apply-runtime-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate final source files
        run: node scripts/run-runtime-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npx next build
      - name: Commit final source instead of build-time patches
        run: |
          node -e 'const fs=require("fs"); const p="netlify.toml"; let s=fs.readFileSync(p,"utf8"); s=s.replace("node scripts/run-runtime-fixes.mjs && npx next build", "npx next build"); fs.writeFileSync(p,s);'
          rm -f scripts/apply-runtime-fixes.mjs scripts/run-runtime-fixes.mjs .github/workflows/apply-runtime-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix report regeneration, cloud sync, and KPI uploads"
          git push
