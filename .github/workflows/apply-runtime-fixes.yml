name: Apply runtime fixes

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-runtime-fixes.mjs
      - .github/workflows/apply-runtime-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-runtime-fixes.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit fixes
        run: |
          rm -f scripts/apply-runtime-fixes.mjs .github/workflows/apply-runtime-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix report regeneration, cloud sync, and KPI uploads"
          git push
# trigger
